<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리아이 사료 급여량 계산기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  body { background:#f7f7f5; color:#1a1a1a; display:flex; justify-content:center; padding:24px 16px; }
  .card { background:#fff; width:100%; max-width:440px; border:2px solid #1a1a1a; border-radius:20px; padding:28px 24px; box-shadow:6px 6px 0 #1a1a1a; }
  h1 { font-size:22px; margin-bottom:6px; }
  .sub { font-size:13px; color:#888; margin-bottom:22px; }
  label { display:block; font-size:14px; font-weight:700; margin:16px 0 6px; }
  .num { display:inline-block; background:#1a1a1a; color:#fff; border-radius:6px; font-size:12px; padding:1px 7px; margin-right:6px; }
  input, select { width:100%; padding:12px 14px; font-size:16px; border:1.5px solid #1a1a1a; border-radius:10px; background:#fff; }
  input:focus, select:focus { outline:2px solid #1a1a1a; }
  .hint { font-size:12px; color:#999; margin-top:4px; }
  button { width:100%; margin-top:24px; padding:14px; font-size:16px; font-weight:800; background:#1a1a1a; color:#fff; border:none; border-radius:12px; cursor:pointer; }
  button:active { transform:translate(2px,2px); }
  .result { display:none; margin-top:24px; border-top:2px dashed #1a1a1a; padding-top:18px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding:10px 4px; border-bottom:1px solid #eee; }
  .row .k { font-size:14px; color:#555; }
  .row .v { font-size:18px; font-weight:800; }
  .row .v small { font-size:12px; font-weight:400; color:#888; }
  .highlight { background:#1a1a1a; color:#fff; border-radius:12px; padding:16px; margin-top:14px; text-align:center; }
  .highlight .big { font-size:24px; font-weight:800; }
  .highlight .desc { font-size:13px; margin-top:4px; color:#ccc; }
  .err { color:#d33; font-size:13px; margin-top:12px; display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>🐶 우리아이 사료 얼마나 먹여야 할까?</h1>
  <div class="sub">4가지만 입력하면 자동 계산!</div>

  <label><span class="num">1</span>체중 (kg)</label>
  <input type="number" id="weight" step="0.1" min="0.1" placeholder="예: 5.2">

  <label><span class="num">2</span>상태</label>
  <select id="status">
    <option value="">선택하세요</option>
    <option value="3">4개월 미만</option>
    <option value="2">5개월~성견</option>
    <option value="1.8">비중성화 성견</option>
    <option value="1.6">중성화 성견</option>
    <option value="1.4">과체중 성견</option>
    <option value="1.0">비만 성견</option>
  </select>

  <label><span class="num">3</span>나이대</label>
  <select id="age">
    <option value="">선택하세요</option>
    <option value="5">생후 7주 이전</option>
    <option value="4">생후 7~16주</option>
    <option value="3">생후 17~28주</option>
    <option value="2">생후 29주 이후</option>
  </select>

  <label><span class="num">4</span>급여 중인 사료의 1g당 칼로리 (kcal/g)</label>
  <input type="number" id="kcal" step="0.01" min="0.1" placeholder="예: 3.8 (사료 포장지 참고)">
  <div class="hint">* 포장지에 kcal/kg로 적혀있다면 1000으로 나눠 입력하세요</div>

  <button onclick="calc()">계산하기</button>
  <div class="err" id="err">모든 항목을 올바르게 입력해주세요.</div>

  <div class="result" id="result">
    <div class="row"><span class="k">기초대사량 (RER)</span><span class="v" id="rer"></span></div>
    <div class="row"><span class="k">하루 필요 에너지 (DER)</span><span class="v" id="der"></span></div>
    <div class="row"><span class="k">일일 사료량</span><span class="v" id="food"></span></div>
    <div class="highlight">
      <div class="big" id="perMeal"></div>
      <div class="desc" id="mealDesc"></div>
    </div>
  </div>
</div>

<script>
function calc(){
  const w = parseFloat(document.getElementById('weight').value);
  const factor = parseFloat(document.getElementById('status').value);
  const meals = parseInt(document.getElementById('age').value);
  const kcal = parseFloat(document.getElementById('kcal').value);
  const err = document.getElementById('err');
  if(!w || !factor || !meals || !kcal || w<=0 || kcal<=0){ err.style.display='block'; document.getElementById('result').style.display='none'; return; }
  err.style.display='none';

  const rer = 70 * Math.pow(w, 0.75);
  const der = rer * factor;
  const grams = der / kcal;
  const perMeal = grams / meals;

  document.getElementById('rer').innerHTML = rer.toFixed(0) + ' <small>kcal/day</small>';
  document.getElementById('der').innerHTML = der.toFixed(0) + ' <small>kcal/day</small>';
  document.getElementById('food').innerHTML = grams.toFixed(0) + ' <small>g/day</small>';
  document.getElementById('perMeal').textContent = '한 번에 ' + perMeal.toFixed(0) + 'g씩, 하루 ' + meals + '회';
  document.getElementById('mealDesc').textContent = '총 ' + grams.toFixed(0) + 'g을 ' + meals + '번에 나눠 급여하세요';
  document.getElementById('result').style.display='block';
}
</script>
</body>
</html>
